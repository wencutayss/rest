spring.application.name=notification-service
server.port=8007

# Spring Cloud Config (Disabled for Dev Mode)
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Database Configuration (H2 In-Memory for Development)
spring.datasource.url=jdbc:h2:mem:notificationdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Eureka Discovery (Disabled for Dev Mode)
eureka.client.enabled=false

# Kafka (Optional - disabled for dev mode)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.auto-startup=false

# Mail (Optional - for production use)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.enable.jvm=true


