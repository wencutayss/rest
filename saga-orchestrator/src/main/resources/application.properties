spring.application.name=saga-orchestrator
server.port=8010

# Spring Cloud Config (Disabled for Dev Mode)
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# Database Configuration (H2 In-Memory for Development)
spring.datasource.url=jdbc:h2:mem:sagadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Eureka Discovery (Disabled for Dev Mode)
eureka.client.enabled=false

# Kafka (Optional - disabled for dev mode)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=saga-orchestrator
spring.kafka.auto-startup=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.enable.jvm=true


